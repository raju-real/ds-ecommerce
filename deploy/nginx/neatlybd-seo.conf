# neatlybd.com — nginx additions for SEO and speed (from the SEO check of 11 Nov 2026).
#
# How to use (on the server, as root):
#   1. Open the site config:   nano /etc/nginx/sites-available/neatlybd.com   (or the file that has "server_name neatlybd.com")
#   2. PART A: in the HTTPS server block that serves the site, REMOVE "www.neatlybd.com" from its server_name line,
#      so it reads:   server_name neatlybd.com;
#      Then paste PART A as a NEW server block (outside the existing one).
#   3. Paste PART B and PART C INSIDE the existing HTTPS server block for neatlybd.com,
#      above the "location /" block.
#   4. Test and reload:   nginx -t && systemctl reload nginx
#      (If "nginx -t" shows an error, nothing changes — fix the line it names, or undo the paste.)
#
# Check afterwards (from any computer):
#   curl -I https://www.neatlybd.com/            → 301, Location: https://neatlybd.com/
#   curl -I https://neatlybd.com/index.php       → 301, Location: https://neatlybd.com/
#   curl -I -H "Accept-Encoding: gzip" https://neatlybd.com/css/shop.css   → Content-Encoding: gzip, Cache-Control: max-age=31536000
#   curl -I https://neatlybd.com/uploads/…any image…   → Cache-Control: max-age=2592000


# ---------------------------------------------------------------------------------------------
# PART A — one address for Google: https://www.neatlybd.com → https://neatlybd.com (301)
# (http:// is already redirected to https:// by the existing config.)
# Uses the same certificate, which already covers www.neatlybd.com.
# Copy the two ssl_certificate lines from your existing server block if they differ from these.
# ---------------------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.neatlybd.com;

    ssl_certificate     /etc/letsencrypt/live/neatlybd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neatlybd.com/privkey.pem;

    return 301 https://neatlybd.com$request_uri;
}


# ---------------------------------------------------------------------------------------------
# PART B — inside the neatlybd.com HTTPS server block: compression + /index.php duplicate
# ---------------------------------------------------------------------------------------------

    # Compress text files (HTML is already compressed; CSS, JS, JSON, SVG, XML were not).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml image/svg+xml text/plain;

    # https://neatlybd.com/index.php showed the home page a second time. Only the address typed by the
    # visitor is checked ($request_uri), so Laravel's own internal use of index.php keeps working.
    if ($request_uri ~* "^/index\.php/?(\?.*)?$") {
        return 301 https://neatlybd.com/$1;
    }


# ---------------------------------------------------------------------------------------------
# PART C — inside the neatlybd.com HTTPS server block: let browsers keep files (faster repeat visits)
# ---------------------------------------------------------------------------------------------

    # CSS / JS: the site adds ?v=… to the address whenever the file changes, so a long cache is safe.
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded images (products, banners, logos): every upload gets a new random file name, so 30 days is safe.
    location ~* ^/uploads/.+\.(?:webp|jpe?g|png|gif|svg|ico|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Other images and fonts in /images, favicon.
    location ~* \.(?:webp|jpe?g|png|gif|svg|ico|avif|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }
